    <title>Sankmux_11.7 Terminal</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <meta name="theme-color" content="#050505">

    <style>
        :root {
            --term-color: #00ff00; 
        }

        body.pro-theme {
            --term-color: #00e5ff; 
        }

        body {
            background-color: #050505;
            color: var(--term-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            text-shadow: 0 0 5px var(--term-color);
            transition: all 0.5s ease; 
        }

        #terminal-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 90vh;
            transition: all 0.5s ease;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            word-wrap: break-word;
            transition: font-size 0.5s ease;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: var(--term-color);
            margin-right: 10px;
            font-weight: bold;
            transition: all 0.5s ease;
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--term-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            text-shadow: 0 0 5px var(--term-color);
            transition: all 0.5s ease;
        }

        #input-container {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000; 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--term-color); 
            transition: background 0.5s ease;
        }

        /* --- Mobile Layout Mode --- */
        body.mobile-mode {
            padding: 10px;
        }
        body.mobile-mode #terminal-container {
            max-width: 400px;
            height: 85vh;
            border: 2px solid var(--term-color);
            border-radius: 20px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 0 15px var(--term-color) inset;
        }
        body.mobile-mode #command-input, 
        body.mobile-mode #output, 
        body.mobile-mode .prompt {
            font-size: 14px;
        }

        /* Adjusted CSS for giant ASCII Arts */
        .giant-art {
            white-space: pre;
            font-size: 10px;
            line-height: 10px;
            overflow-x: hidden;
            margin-bottom: 15px;
        }
        
        body.mobile-mode .giant-art {
            font-size: 5px; 
            line-height: 5px;
        }

        /* For the Home Screen logos so they don't wrap and break */
        .ascii-logo {
            white-space: pre; 
            font-size: 11px;
            line-height: 12px;
            overflow-x: hidden;
        }

        body.mobile-mode .ascii-logo {
            font-size: 5px;
            line-height: 6px;
        }

        /* Permanent Creator Watermark */
        .watermark {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 12px;
            opacity: 0.5;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* UI Action Buttons */
        #btn-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .ui-btn {
            background-color: #050505;
            color: var(--term-color);
            border: 1px solid var(--term-color);
            padding: 8px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 5px var(--term-color);
            transition: all 0.3s ease;
        }

        .ui-btn:hover {
            background-color: var(--term-color);
            color: #050505;
            box-shadow: 0 0 15px var(--term-color);
        }

        #exit-pro-btn {
            display: none; 
        }

        body.pro-theme #exit-pro-btn {
            display: block; 
        }

        @media (max-width: 600px) {
            #btn-container {
                flex-direction: column;
                gap: 5px;
                top: 10px;
                right: 10px;
            }
            .ui-btn {
                font-size: 10px;
                padding: 5px 8px;
            }
        }

        /* Extra Bright Rainbow Text Animation */
        @keyframes rainbow {
            0% { color: #FF0000; text-shadow: 0 0 8px #FF0000, 0 0 15px #FF0000; }
            15% { color: #FF8000; text-shadow: 0 0 8px #FF8000, 0 0 15px #FF8000; }
            30% { color: #FFFF00; text-shadow: 0 0 8px #FFFF00, 0 0 15px #FFFF00; }
            45% { color: #00FF00; text-shadow: 0 0 8px #00FF00, 0 0 15px #00FF00; }
            60% { color: #0000FF; text-shadow: 0 0 8px #0000FF, 0 0 15px #0000FF; }
            75% { color: #4B0082; text-shadow: 0 0 8px #4B0082, 0 0 15px #4B0082; }
            90% { color: #9400D3; text-shadow: 0 0 8px #9400D3, 0 0 15px #9400D3; }
            100% { color: #FF0000; text-shadow: 0 0 8px #FF0000, 0 0 15px #FF0000; }
        }

        .rainbow-text {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #0000ff, #8a2be2, #ff00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-slide 4s linear infinite;
            text-shadow: none; 
        }

        @keyframes rainbow-slide {
            to {
                background-position: -200% center;
            }
        }
    </style>

                    break;

                case 'remove':
                    if (args[1] === 'all' && args[2] === 'pkgs') {
                        printLine(`Initiating absolute purge protocol...`);
                        setTimeout(() => removeAllPkgsLogic(), 1000);
                    } else {
                        printLine(`bash: remove: command not found (Did you mean 'remove all pkgs'?)`);
                    }
                    break;

                case 'check':
                    if (args[1] === 'all' && args[2] === 'pkgs') {
                        const savedPkgs = getInstalledPackages();
                        if (savedPkgs.length === 0) {
                            printLine("No packages installed. (Cache is empty or expired)");
                        } else {
                            printLine("Installed Packages (Valid for 72 hours):");
                            savedPkgs.forEach(pkg => {
                                printLine(`  [*] ${pkg}`);
                            });
                        }
                    } else {
                        printLine(`bash: check: command not found`);
                    }
                    break;

                case 'set':
                    if (args[1] === 'to' && args[2] === 'mobile') {
                        document.body.classList.add('mobile-mode');
                        printLine("Viewport set to Mobile layout.");
                    } else if (args[1] === 'to' && args[2] === 'laptop') {
                        document.body.classList.remove('mobile-mode');
                        printLine("Viewport set to Laptop layout.");
                    } else {
                        printLine("Usage: set to mobile | set to laptop");
                    }
                    break;

                default:
                    printLine(`bash: ${cmd}: command not found`);
            }
            
            if(cmd !== 'clear' && cmd !== '5' && cmd !== 'chat') { printLine(" "); }
        }

        document.addEventListener('click', () => {
            if (inputContainer.style.display === 'flex') {
                commandInput.focus();
            }
        });
    </script>
</body>
